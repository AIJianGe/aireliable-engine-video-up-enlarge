# ============================================================
# videoUpEnlarge 视频高清放大引擎 manifest（v0.1）
# ------------------------------------------------------------
# 定位：平台"视频超分辨率（空间维度增强）"能力
#   - paradigm: integrated（完全自定义模式，继承 CustomEngine）
#   - capability: video-upscale（网关 POST /v1/videos/upscale 硬性校验）
#   - task_type : video_upscale（任务中心分类；调度走 heavy_task 串行槽）
#
# 首期后端：Real-ESRGAN ncnn-vulkan（Windows x64 便携包）
#   - 通过 Vulkan 运行，**不依赖 torch / CUDA**（引擎环境极轻）
#   - 便携包（zip）内含 exe + 4 个 ncnn 模型，属"整包资源"，
#     故只声明 1 条 model_file；引擎首次 /load 时对本地 zip 做**离线解包**
#     （不联网下载，符合 project-rules「只校验不下载」）
#
# 2 个档位 variant（均为同一便携包内的不同 ncnn 模型）：
#   - videoUpEnlarge/realesrgan-x4plus    ：通用写实（默认）
#   - videoUpEnlarge/realesr-animevideov3 ：动漫 / 插画 / 风格化视频
#
# ⚠️ variant.name 必须与 model_scanner.py 的 _KNOWN_VARIANTS 逐字一致
#    （variant 扫描匹配契约，双处不一致 → UI 扫不到 → 无法触发下载）
#
# 批次规划：二期接入 SeedVR2（3B/7B FP16）时，在此新增 variant + 新增
#          model_files，并同步 model_scanner.py；同时 uv_env 需引入 torch。
#          注意本机 GPU 为 Turing（SM 7.5）：无 BF16 / FP8 /
#          FlashAttention-2，二期须用 FP16 + PyTorch SDPA。
#
# 字段规范详见 PR/development-guide.md §30 manifest.yaml v0.2 规范
# 校验逻辑见 core/src/core/manifest_schema.py
# ============================================================

# ===== v0.1 必需字段 =====
engine_id: video_up_enlarge_98782fcd
engine_name: VideoUpEnlarge
engine_version: 1.0.0
aireliable_compat: ">=0.0.16"
uv_env_name: video-upenlarge
export_mode: source

# ===== v0.1 可选字段 =====
description: "videoUpEnlarge 视频高清放大引擎（视频超分辨率 / 空间维度增强）。首期后端 Real-ESRGAN ncnn-vulkan：ffmpeg 抽帧 → ncnn 目录模式超分 → 合帧并回填原音轨。支持 2x/3x/4x 倍率或指定目标宽高，输出保留原音频。"

# ===== v0.2 新增字段 =====
# ⚠️ capability / capabilities 不是 manifest 顶层字段（extra=forbid 会报错），
#    能力由引擎 /capabilities 端点声明（server.py 实现 video-upscale），
#    部署侧能力声明见 config/engines/video_up_enlarge_98782fcd.yaml
engine_uid: aireliable://aijiange/video/video_up_enlarge_98782fcd
paradigm: integrated
sdk_version: ">=0.3.0"

# 作者信息
author:
  name: AI剑歌

# 第三方开源引用（BSD-3-Clause，可再分发）
third_party_references:
  - name: Real-ESRGAN
    author: Xintao Wang (xinntao)
    github: https://github.com/xinntao/Real-ESRGAN
    license: BSD-3-Clause
    description: 超分算法与 ncnn-vulkan 便携可执行文件（含 realesrgan-x4plus / realesr-animevideov3 等模型权重）
  - name: Real-ESRGAN-ncnn-vulkan
    author: nihui / xinntao
    github: https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan
    license: BSD-3-Clause
    description: ncnn + Vulkan 推理实现（免 CUDA / 免 PyTorch 的跨厂商 GPU 推理路径）
  - name: ncnn
    author: Tencent
    github: https://github.com/Tencent/ncnn
    license: BSD-3-Clause
    description: 便携包内嵌的高性能神经网络推理框架
  - name: FFmpeg
    author: FFmpeg Team
    github: https://github.com/FFmpeg/FFmpeg
    license: LGPL-2.1-or-later
    description: 抽帧 / 合帧 / 音轨回填（通过 imageio-ffmpeg 分发或系统 PATH 调用，未静态链接）

# 升级信息（2026-11-02 补齐 upgrade 块：检查自家引擎仓库 tag）
upgrade:
  check_url: https://api.github.com/repos/AIJianGe/aireliable-engine-video-up-enlarge/releases/latest
  auto_check: true

# integrated 范式不依赖节点包
node_packages: []

# ============================================================
# v0.2.5+ 引擎环境配置（env_config 块）
# 供 EngineEnvManager 读取以决定是否检测 torch 等。
#
# ⚠️ requires_torch: false —— 本引擎走 Vulkan，**不依赖 torch / CUDA**，
#    这是首期"轻量"的关键优势（环境仅需 ffmpeg + HTTP 栈）。
# ============================================================
env_config:
  requires_torch: false
  requires_python: '>=3.10,<3.13'
  notes: 'videoUpEnlarge 首期后端为 Real-ESRGAN ncnn-vulkan：不依赖 torch / CUDA，仅需要 ffmpeg（抽帧/合帧）与 FastAPI；GPU 通过 Vulkan 驱动调用，与 CUDA 版本无关。二期接入 SeedVR2 时需改为 requires_torch: true。'

# ============================================================
# v0.2.1 新增：models 块（模型分类规范化）
# 详见 PR/architecture.md §16.4
# ============================================================
models:
  # ===== 模型目录布局（与 config.py 的 _DEFAULT_MODEL_SUBDIR 保持一致）=====
  model_layout:
    base: video/upscale/realesrgan/

  # ===== 默认 variant（通用写实档，最普适）=====
  default_variant: videoUpEnlarge/realesrgan-x4plus

  # ===== 档位列表（2 个，按 ncnn 模型划分）=====
  # v0.3.6+ variant.name 必须为 author/model 格式（命名空间规范）
  # ⚠️ name 必须与引擎 model_scanner.py 的 _KNOWN_VARIANTS 完全一致
  variants:
    # ----- 1. 通用写实（默认）-----
    - name: videoUpEnlarge/realesrgan-x4plus
      alias: RealESRGAN-x4plus
      base_model: Real-ESRGAN
      precision: fp16
      loader: ncnn-vulkan
      vram_required: 2GB                 # 1080p 分块推理约 2GB
      path: video/upscale/realesrgan
      model_file_ids:
        - vuen-ncnn-bundle
      uv_env: envs/video-upenlarge

    # ----- 2. 动漫 / 风格化视频 -----
    - name: videoUpEnlarge/realesr-animevideov3
      alias: RealESRGAN-animevideo
      base_model: Real-ESRGAN (AnimeVideo-v3)
      precision: fp16
      loader: ncnn-vulkan
      vram_required: 2GB
      path: video/upscale/realesrgan
      model_file_ids:
        - vuen-ncnn-bundle
      uv_env: envs/video-upenlarge

  # ===== 模型文件清单（1 条：整包资源）=====
  #
  # 说明：Real-ESRGAN ncnn-vulkan 官方只提供"便携包 zip"（内含 exe + 4 个
  # ncnn 模型），**没有**逐文件的独立直链，因此这里按"整包"声明 1 条：
  #   - 平台模型管理下载 zip 到 target_dir
  #   - 引擎首次 /load 时离线解包（zipfile，不联网），得到
  #       <target_dir>/realesrgan-ncnn-vulkan.exe（+ vcomp140.dll 等运行时）
  #       <target_dir>/models/{realesrgan-x4plus,realesrgan-x4plus-anime,realesr-animevideov3-x2|3|4}.bin/.param
  #   - 之后所有 variant 复用同一套资源
  # 未声明 key_files（那是 format=marker 的语义，指"从 HF 仓库逐个拉取"，
  # 本资源不是 HF 仓库，故不适用）。
  model_files:
    - id: vuen-ncnn-bundle
      role: upscale
      filename: realesrgan-ncnn-vulkan-20220424-windows.zip
      target_dir: video/upscale/realesrgan
      format: binary
      size_bytes: 45474481               # 45.5 MB（2026-09-17 官方资产实测 Content-Length）
      required_for:
        - videoUpEnlarge/realesrgan-x4plus
        - videoUpEnlarge/realesr-animevideov3
      source:
        type: url
        url: https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip
      description: "Real-ESRGAN ncnn-vulkan Windows x64 便携包（45.5MB）。内含 realesrgan-ncnn-vulkan.exe（6.2MB）+ vcomp140.dll/vcomp140d.dll（MSVC OpenMP 运行时，必需）+ models/ 下 4 组 ncnn 权重（realesrgan-x4plus 33.4MB / realesrgan-x4plus-anime 8.9MB / realesr-animevideov3-x2|x3|x4 各 1.2MB）。zip 为平铺结构（无顶层目录），引擎首次 /load 时自动离线解包到本目录。BSD-3-Clause，可再分发。"
